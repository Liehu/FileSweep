<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileSweep - 智能文件整理工具</title>
    <script>
      // 无头模式检测：如果不是 Tauri 环境，标记为 headless
      if (!window.__TAURI_INTERNALS__) {
        window.__FILESWEEP_HEADLESS__ = true;
        // 从 URL 参数获取端口
        const urlParams = new URLSearchParams(window.location.search);
        const port = urlParams.get('port') || '3210';
        window.__PORT__ = parseInt(port, 10);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
